<div class="pf-wrap">

  <header class="pf-topbar">
    <div class="pf-topbar-left">
      <button class="pf-back" (click)="goBack()">← volver</button>
      <span class="pf-path"><button class="pf-home-link" (click)="goBack()"><span class="pf-accent">~/felipe-mejia</span></button> % ls proyectos/ → {{ projects.length }} resultados</span>
    </div>
  </header>
  <div class="pf-divider"></div>

  <div class="pf-header">
    <span class="pf-label">// proyectos seleccionados</span>
    <h1 class="pf-title">Proyectos</h1>
  </div>

  <div class="pf-grid">
    <div class="pf-card" *ngFor="let project of projects; let i = index">
      <div class="pf-card-img">
        <ng-container *ngIf="project.images.length > 0; else noImg">
          <img [src]="project.images[activeIndex[i]]" [alt]="project.title" class="pf-img">
          <div class="pf-carousel-controls" *ngIf="project.images.length > 1">
            <button class="pf-carr-btn" (click)="prev(i)">‹</button>
            <span class="pf-carr-dots">
              <span *ngFor="let img of project.images; let d = index"
                    class="pf-dot" [class.active]="d === activeIndex[i]"></span>
            </span>
            <button class="pf-carr-btn" (click)="next(i)">›</button>
          </div>
        </ng-container>
        <ng-template #noImg>
          <div class="pf-placeholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span class="pf-ph-text">Sin imagen del proyecto</span>
          </div>
        </ng-template>
      </div>
      <div class="pf-card-body">
        <span class="pf-card-num">{{ project.num }}</span>
        <h2 class="pf-card-title">{{ project.title }}</h2>
        <p class="pf-card-desc">{{ project.desc }}</p>
        <div class="pf-card-tags" *ngIf="project.tags.length > 0">
          <span class="pf-tag" *ngFor="let tag of project.tags">{{ tag }}</span>
        </div>
        <div class="pf-tag-groups" *ngIf="project.tagGroups && project.tagGroups.length > 0">
          <div class="pf-tag-group" *ngFor="let group of project.tagGroups">
            <span class="pf-group-label">{{ group.label }}</span>
            <div class="pf-group-tags">
              <span class="pf-tag" *ngFor="let tag of group.tags">{{ tag }}</span>
            </div>
          </div>
        </div>
        <div class="pf-card-actions" *ngIf="project.link || project.repo">
          <a *ngIf="project.link" [href]="project.link" target="_blank" class="pf-action-link">Ver proyecto ↗</a>
          <a *ngIf="project.repo" [href]="project.repo" target="_blank" class="pf-action-repo">○ GitHub</a>
        </div>
      </div>
    </div>
  </div>

</div>
