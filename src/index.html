<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Full Stack Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Full-stack architect specializing in high-end frontend interfaces and robust Node.js environments">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fuentes: Fira Code para estilo terminal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>

  <!-- Loading Screen (opcional) -->
  <div id="loading-screen" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #05070d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: 'Fira Code', monospace;
    color: #00f0ff;
  ">
    <div style="font-size: 1.5rem; margin-bottom: 2rem;">Iniciando Sistema...</div>
    <div style="width: 300px; height: 3px; background: rgba(0, 240, 255, 0.2); border-radius: 2px; overflow: hidden;">
      <div style="width: 0%; height: 100%; background: #00f0ff; box-shadow: 0 0 10px #00f0ff; animation: loading 2s ease-in-out forwards;"></div>
    </div>
  </div>

  <style>
    @keyframes loading {
      to {
        width: 100%;
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }

    /* Hide loading screen after Angular loads */
    app-root:not(:empty) ~ #loading-screen {
      animation: fadeOut 0.5s ease-out forwards;
      pointer-events: none;
    }
  </style>

  <script>
    // Ocultar loading screen después de que Angular se cargue
    document.addEventListener('DOMContentLoaded', function() {
      console.log('🔍 DOM cargado, esperando a Angular...');

      const appRoot = document.querySelector('app-root');
      const loadingScreen = document.getElementById('loading-screen');

      // Verificar cada 100ms si Angular ha renderizado
      const checkInterval = setInterval(() => {
        if (appRoot && appRoot.children.length > 0) {
          console.log(' Angular renderizado, ocultando loading screen');
          loadingScreen.style.animation = 'fadeOut 0.5s ease-out forwards';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500);
          clearInterval(checkInterval);
        }
      }, 100);

      // Timeout de seguridad: ocultar después de 5 segundos de todos modos
      setTimeout(() => {
        console.log(' Timeout: ocultando loading screen forzadamente');
        loadingScreen.style.display = 'none';
        clearInterval(checkInterval);
      }, 5000);
    });
  </script>

</body>
</html>
